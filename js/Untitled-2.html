<main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <nav aria-label="Breadcrumb" class="flex mb-8 text-sm text-gray-500 dark:text-gray-400">
        <ol class="inline-flex items-center space-x-1 md:space-x-3">
            <li class="inline-flex items-center">
                <a class="inline-flex items-center hover:text-primary dark:hover:text-white" href="index.html">
                    <span class="material-icons text-base mr-2">home</span> Inicio
                </a>
            </li>
            <li>
                <div class="flex items-center">
                    <span class="material-icons text-gray-400 text-base">chevron_right</span>
                    <span id="breadcrumb-activo" class="ml-1 md:ml-2 font-medium text-gray-900 dark:text-white">Catálogo
                        Completo</span>
                </div>
            </li>
        </ol>
    </nav>

    <div class="flex flex-col lg:flex-row gap-8">
        <aside class="w-full lg:w-64 flex-shrink-0">
            <div
                class="bg-white dark:bg-surface-dark rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 p-5 sticky top-24">
                <div class="flex items-center justify-between lg:hidden mb-4">
                    <h3 class="font-bold text-lg text-gray-900 dark:text-white">Filtros</h3>
                    <button class="text-primary text-sm font-medium">Ocultar</button>
                </div>
                <h3
                    class="hidden lg:block font-bold text-lg text-gray-900 dark:text-white mb-5 pb-2 border-b border-gray-100 dark:border-gray-700">
                    Filtros</h3>

                <div class="mb-6">
                    <h4 class="font-semibold text-gray-800 dark:text-gray-200 mb-3 flex justify-between cursor-pointer">
                        Categorías <span class="material-icons text-sm text-gray-400">expand_less</span>
                    </h4>
                    <div id="categorias-filter-container" class="space-y-2 max-h-64 overflow-y-auto custom-scrollbar">
                        <p class="text-xs text-gray-400">Cargando categorías...</p>
                    </div>
                </div>

                <div class="mb-6">
                    <h4 class="font-semibold text-gray-800 dark:text-gray-200 mb-3 flex justify-between cursor-pointer">
                        Precio <span class="material-icons text-sm text-gray-400">expand_less</span>
                    </h4>
                    <div class="px-1">
                        <div class="flex items-center justify-between text-xs text-gray-500 mb-2">
                            <span>Bs 0</span>
                            <span id="price-max-display">Bs 500+</span>
                        </div>
                        <input id="price-range-input"
                            class="w-full h-1 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary"
                            max="500" min="0" step="10" type="range" value="500" />
                        <div class="flex items-center gap-2 mt-4">
                            <input id="min-price"
                                class="w-full pl-2 pr-1 py-1 text-sm border border-gray-300 rounded dark:bg-gray-700 dark:border-gray-600"
                                placeholder="Min" type="number" />
                            <span class="text-gray-400">-</span>
                            <input id="max-price"
                                class="w-full pl-2 pr-1 py-1 text-sm border border-gray-300 rounded dark:bg-gray-700 dark:border-gray-600"
                                placeholder="Max" type="number" />
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <section class="flex-grow">
            <div
                class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 bg-white dark:bg-surface-dark p-4 rounded-xl border border-gray-100 dark:border-gray-700 shadow-sm">
                <div>
                    <h1 id="titulo-categoria" class="text-xl font-bold text-gray-900 dark:text-white">Todos los
                        Productos</h1>
                    <p id="productos-conteo" class="text-sm text-gray-500 dark:text-gray-400">Cargando productos...
                    </p>
                </div>
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <span class="text-sm text-gray-600 dark:text-gray-400 whitespace-nowrap hidden sm:inline">Ordenar
                        por:</span>
                    <select id="sort-select"
                        class="form-select block w-full md:w-48 pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-primary focus:border-primary sm:text-sm rounded-md dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                        <option>Más Relevantes</option>
                        <option>Precio: Menor a Mayor</option>
                        <option>Precio: Mayor a Menor</option>
                        <option>Lo más nuevo</option>
                        <option>Mejor calificados</option>
                    </select>
                    <div class="flex bg-gray-100 dark:bg-gray-700 rounded-lg p-1 gap-1">
                        <button id="grid-view-button"
                            class="p-1.5 rounded bg-white dark:bg-gray-600 text-primary shadow-sm">
                            <span class="material-icons text-xl block">grid_view</span>
                        </button>
                        <button id="list-view-button"
                            class="p-1.5 rounded hover:bg-white dark:hover:bg-gray-600 text-gray-500 dark:text-gray-400 transition-colors">
                            <span class="material-icons text-xl block">view_list</span>
                        </button>
                    </div>
                </div>
            </div>

            <div id="active-filters-container" class="flex flex-wrap gap-2 mb-6 hidden">
                <div id="applied-tags" class="flex flex-wrap gap-2">
                </div>
                <button id="btn-limpiar-filtros"
                    class="text-xs text-gray-500 underline hover:text-primary transition-colors">Limpiar
                    filtros</button>
            </div>

            <div id="product-grid-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>

            <div class="mt-12 flex justify-center">
                <nav class="flex items-center gap-2" id="pagination-controls">
                </nav>
            </div>
        </section>
    </div>
</main>
